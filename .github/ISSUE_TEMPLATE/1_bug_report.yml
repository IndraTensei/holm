name: Bug report
description: Something in Holm doesn't work the way it should.
labels: ["type: bug", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please check the [open issues](https://github.com/IndraTensei/holm/issues) first, in case it's already known.
        A game that isn't recognised or shows the wrong logo has [its own form](https://github.com/IndraTensei/holm/issues/new?template=3_game_support.yml), and so does [high CPU or memory](https://github.com/IndraTensei/holm/issues/new?template=4_performance.yml).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps, as exact as you can. Which app was in front, was music playing, was an agent running?
      placeholder: |
        1. Maximize Chrome
        2. Move the pointer to the tabs
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Holm. Your best guess is fine.
      options: [The island itself, Music, Claude Code and agents, Harnesses, Games, Shelf and widgets, Settings, Install and updates, Something else]
    validations:
      required: true
  - type: input
    id: holm
    attributes:
      label: Holm version
      description: Settings → About shows it.
      placeholder: "0.1.6"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options: [Installer, Portable exe, Built from source]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      description: Press Win+R, type winver.
      placeholder: Windows 11 24H2 (build 26100)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, clips or anything else
      description: Display scaling, more than one monitor, the theme or style you use. Holm's log, island.log, is in %APPDATA%\in.tenseitech.holm.
