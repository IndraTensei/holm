name: Documentation or website
description: Something in the README, the guides or holm.indratensei.me is wrong, unclear or missing.
labels: ["type: docs", "status: needs triage"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: A link to the page or file.
      placeholder: https://github.com/IndraTensei/holm#build-from-source
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong or missing
    validations:
      required: true
