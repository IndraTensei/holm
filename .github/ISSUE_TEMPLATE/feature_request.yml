name: Feature request
description: An idea for something Holm could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you'd like
      description: What should Holm do, and in which situation would you use it?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What do you do today instead, and what gets in the way?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [The island itself, Music, Claude Code and agents, Harnesses, Games, Shelf and widgets, Settings, Install and updates, Something else]
  - type: checkboxes
    id: help
    attributes:
      label: Helping out
      options:
        - label: I'd like to build this myself, with some guidance.
