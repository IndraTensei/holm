# One pull request a quarter with every update (npm, Cargo and GitHub Actions together), instead of
# a stream: review it, run the app, merge.
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: quarterly
updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: cargo
    directory: /src-tauri
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
