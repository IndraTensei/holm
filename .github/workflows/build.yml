name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend packages
        run: npm ci

      - name: Type-check the frontend
        run: npm run check

      - name: Lint and test the backend
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      # Tauri downloads NSIS and its helper DLL from GitHub on every build; keep them, so a GitHub
      # hiccup (a 504 here has failed releases) can't stop a build, and retry the bundling once.
      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: tauri-tools-${{ runner.os }}-

      - name: Build installer and app
        shell: pwsh
        run: |
          npx tauri build
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Bundling failed; trying once more in 20 s."
            Start-Sleep 20
            npx tauri build
          }

      - name: Package portable build
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/holm.exe "Holm-$version-portable-x64.exe"
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { Copy-Item $_ . }
          Get-ChildItem *.exe | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: holm-windows
          path: |
            *-setup.exe
            *-portable-x64.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Holm ${{ github.ref_name }}
          # Written notes from docs/releases/<tag>.md when there are some; the merged PRs follow.
          body_path: ${{ hashFiles(format('docs/releases/{0}.md', github.ref_name)) != '' && format('docs/releases/{0}.md', github.ref_name) || '' }}
          files: |
            *-setup.exe
            *-portable-x64.exe
          generate_release_notes: true
